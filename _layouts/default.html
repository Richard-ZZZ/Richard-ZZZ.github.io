<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  {% if site.description %}<meta name="description" content="{{ site.description }}">{% endif %}
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v=20261009-15">
</head>
<body>
  <div id="app">
    <main class="site-header">
      {{ content }}
    </main>
    <canvas id="effects" aria-hidden="true"></canvas>
    <div class="photo-credit" aria-hidden="true">Shot at Lake Ashi, Hakone</div>
  </div>
  <script src="{{ '/assets/scene-effects.js' | relative_url }}" defer></script>
</body>
</html>

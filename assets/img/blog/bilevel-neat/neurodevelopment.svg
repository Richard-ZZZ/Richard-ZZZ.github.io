<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Topology exploration followed by weight optimization</title>
  <desc id="desc">The first phase adds and prunes neural-network nodes and connections. In the second phase, the topology remains fixed while connection weights continue to update.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .phase-title { fill:#243440; font-size:21px; font-weight:700; }
    .phase-sub { fill:#6b7880; font-size:13px; }
    .caption { fill:#51636d; font-size:13px; font-weight:600; letter-spacing:.025em; }
    .panel { fill:#fffdf9; fill-opacity:.52; stroke:#d8cdbd; stroke-width:1.2; }
    .edge { fill:none; stroke:#93aabe; stroke-width:2.2; stroke-linecap:round; }
    .base-edge { animation:baseEdge 12s ease-in-out infinite; }
    .new-edge { stroke:#4f8db8; stroke-dasharray:1; stroke-dashoffset:1; animation:newEdge 12s ease-in-out infinite; }
    .pruned-edge { stroke:#c7735f; stroke-width:2; stroke-dasharray:6 7; animation:pruneEdge 12s ease-in-out infinite; }
    .node { fill:#fffdf9; stroke:#4c7590; stroke-width:2.5; }
    .input { fill:#edf6fa; }
    .output { fill:#fff3e8; stroke:#a85c32; }
    .new-node { opacity:0; animation:newNode 12s ease-in-out infinite; }
    .fixed { fill:none; stroke-linecap:round; }
    .w1 { animation:weightOne 12s ease-in-out infinite; }
    .w2 { animation:weightTwo 12s ease-in-out infinite; }
    .w3 { animation:weightThree 12s ease-in-out infinite; }
    .w4 { animation:weightFour 12s ease-in-out infinite; }
    .phase-one { animation:phaseOne 12s ease-in-out infinite; }
    .phase-two { animation:phaseTwo 12s ease-in-out infinite; }
    .flow { fill:none; stroke:#a99d8d; stroke-width:1.5; }
    @keyframes baseEdge { 0%,100%{opacity:.72} 44%{opacity:.34} 58%{opacity:.72} }
    @keyframes newNode { 0%,12%{opacity:0} 23%,100%{opacity:1} }
    @keyframes newEdge { 0%,18%{stroke-dashoffset:1;opacity:0} 34%,100%{stroke-dashoffset:0;opacity:.92} }
    @keyframes pruneEdge { 0%,20%{opacity:0} 34%,48%{opacity:.85} 58%,100%{opacity:0} }
    @keyframes phaseOne { 0%,48%{opacity:1} 58%,100%{opacity:.42} }
    @keyframes phaseTwo { 0%,48%{opacity:.42} 58%,100%{opacity:1} }
    @keyframes weightOne { 0%,50%{stroke:#9bb0bf;stroke-width:2} 62%{stroke:#2c7897;stroke-width:6} 78%{stroke:#d08048;stroke-width:3} 94%,100%{stroke:#2c7897;stroke-width:5} }
    @keyframes weightTwo { 0%,50%{stroke:#9bb0bf;stroke-width:2} 64%{stroke:#d08048;stroke-width:3} 80%{stroke:#2c7897;stroke-width:6} 94%,100%{stroke:#86a9b7;stroke-width:2.5} }
    @keyframes weightThree { 0%,50%{stroke:#9bb0bf;stroke-width:2} 66%{stroke:#86a9b7;stroke-width:2} 82%{stroke:#d08048;stroke-width:5.5} 94%,100%{stroke:#2c7897;stroke-width:3.5} }
    @keyframes weightFour { 0%,50%{stroke:#9bb0bf;stroke-width:2} 68%{stroke:#2c7897;stroke-width:3.5} 84%{stroke:#86a9b7;stroke-width:1.5} 94%,100%{stroke:#d08048;stroke-width:5} }
    @media (prefers-reduced-motion:reduce) { * { animation-play-state:paused !important; } }
  </style>

  <rect class="panel" x="22" y="20" width="566" height="426" rx="18"/>
  <rect class="panel" x="612" y="20" width="566" height="426" rx="18"/>

  <g class="phase-one">
    <circle cx="54" cy="56" r="7" fill="#4f8db8"/>
    <text class="phase-title" x="72" y="63">Phase 1: Topology Exploration</text>
    <text class="phase-sub" x="54" y="87">nodes and connections are added, tested, and pruned</text>
    <text class="caption" x="54" y="414">STRUCTURE CHANGES</text>

    <path class="edge base-edge" d="M92 168C176 162 213 178 282 218M92 235C172 224 215 215 282 218M92 302C175 292 213 263 282 252M282 218C359 201 392 194 486 210M282 252C365 258 405 255 486 244"/>
    <path class="edge new-edge" pathLength="1" d="M92 168C183 193 215 249 282 286M92 302C172 310 216 298 282 286M282 218C354 231 405 239 486 244M282 286C365 289 411 275 486 244"/>
    <path class="pruned-edge" d="M92 235C181 269 218 286 282 286M92 302C184 239 218 226 282 218M282 252C363 222 407 213 486 210"/>

    <g>
      <circle class="node input" cx="92" cy="168" r="14"/><circle class="node input" cx="92" cy="235" r="14"/><circle class="node input" cx="92" cy="302" r="14"/>
      <circle class="node" cx="282" cy="218" r="15"/><circle class="node new-node" cx="282" cy="252" r="15"/><circle class="node new-node" cx="282" cy="286" r="15"/>
      <circle class="node output" cx="486" cy="210" r="16"/><circle class="node output new-node" cx="486" cy="244" r="16"/>
    </g>

    <g transform="translate(326 408)">
      <circle cx="0" cy="0" r="5" fill="#4f8db8"/><text class="phase-sub" x="12" y="4">add</text>
      <path class="flow" d="M52 0h30m-6-5l7 5-7 5"/>
      <circle cx="104" cy="0" r="5" fill="#c7735f"/><text class="phase-sub" x="116" y="4">prune</text>
    </g>
  </g>

  <g class="phase-two">
    <circle cx="644" cy="56" r="7" fill="#27778b"/>
    <text class="phase-title" x="662" y="63">Phase 2: Weight Optimization</text>
    <text class="phase-sub" x="644" y="87">topology fixed · connection weights continue to update</text>
    <text class="caption" x="644" y="414">WEIGHTS UPDATE</text>

    <path class="fixed w1" d="M682 168C762 163 803 181 854 218M682 235C760 225 802 216 854 218M682 302C759 292 802 266 854 252"/>
    <path class="fixed w2" d="M682 168C766 195 806 251 854 286M682 235C758 249 805 254 854 252M682 302C765 312 805 299 854 286"/>
    <path class="fixed w3" d="M854 218C930 201 970 194 1074 210M854 252C930 258 980 254 1074 244"/>
    <path class="fixed w4" d="M854 218C929 232 978 240 1074 244M854 286C932 289 983 274 1074 244"/>

    <g>
      <circle class="node input" cx="682" cy="168" r="14"/><circle class="node input" cx="682" cy="235" r="14"/><circle class="node input" cx="682" cy="302" r="14"/>
      <circle class="node" cx="854" cy="218" r="15"/><circle class="node" cx="854" cy="252" r="15"/><circle class="node" cx="854" cy="286" r="15"/>
      <circle class="node output" cx="1074" cy="210" r="16"/><circle class="node output" cx="1074" cy="244" r="16"/>
    </g>

    <g transform="translate(890 408)">
      <path class="fixed w1" d="M0 0h38"/><path class="fixed w2" d="M52 0h38"/><path class="fixed w3" d="M104 0h38"/>
      <text class="phase-sub" x="154" y="4">connection strength</text>
    </g>
  </g>
</svg>
